aid: caresyntax
name: Caresyntax
description: 'Caresyntax is a surgical intelligence company that builds a vendor-neutral,
  enterprise-scale data platform for the operating room. Founded in 2013 in Berlin
  and now dual-headquartered in Berlin and San Francisco, it captures video, audio,
  image, device, EMR, financial and outcomes data from inside and around the OR and
  applies AI analytics to it — delivering pre-operative workflow optimization, real-time
  intraoperative decision support, and post-operative clinical safety, quality and
  utilization insights. The platform pairs the PRIME365 vendor-neutral OR / medical-device
  integration layer with the qvident surgical performance-management and analytics
  suite, and is deployed in more than 4,000 operating rooms worldwide. Caresyntax sells
  to hospitals and surgery centers, MedTech manufacturers and insurers, and integrates
  with EMR, PACS and scheduling systems. It operates an API gateway at api.caresyntax.com,
  but publishes no public developer portal, API documentation, SDKs or machine-readable
  API contract — integration is delivered through enterprise and partner engagements.'
